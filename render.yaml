services:
  - type: web
    name: stela
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --no-access-log: uvicorn's access log prints full URLs, which contain coordinates (privacy).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: STELA_CONTACT
        sync: false
